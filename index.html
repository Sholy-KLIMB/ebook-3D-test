<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le guide du CFO : livre 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
model-viewer{position:absolute;inset:0;display:block;width:100%;height:100%;background:transparent;--poster-color:transparent;--progress-bar-height:0}
#livre{opacity:0;pointer-events:none}
#etat{position:absolute;bottom:12px;left:16px;right:16px;margin:0;text-align:center;font:13px system-ui;color:#555;pointer-events:none}
</style>
<script type="module" src="./model-viewer.min.js"></script>
<script type="module" src="./book-spin.js?v=spin-2"></script>
</head>
<body>
<model-viewer id="livre-ferme" src="./livre.glb?v=20260924-fin" alt="Le guide du CFO. Faites glisser pour tourner le livre."
 camera-controls disable-zoom disable-pan touch-action="pan-y" camera-orbit="65deg 68deg 0.8m"
 min-camera-orbit="auto 15deg 0.38m" max-camera-orbit="auto 165deg 1m"
 field-of-view="30deg" shadow-intensity="0.6" exposure="1"
 interaction-prompt="none" loading="eager">
 <span slot="progress-bar" hidden></span>
</model-viewer>
<model-viewer id="livre" src="./livre-ouvert-relie.gltf?v=spine-2" alt="Livre ouvert : chapitre 1. Faites glisser pour le tourner."
 camera-controls disable-zoom disable-pan touch-action="pan-y" camera-orbit="20deg 85deg 80%"
 min-camera-orbit="auto 20deg auto" max-camera-orbit="auto 160deg auto"
 field-of-view="30deg" shadow-intensity="0" exposure="1" interaction-prompt="none" loading="eager">
 <span slot="progress-bar" hidden></span>
</model-viewer>
<p id="etat" role="status" aria-live="polite"></p>
</body>
</html>
